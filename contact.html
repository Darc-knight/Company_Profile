<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <style>
    :root {
      --navy: #0b1f33;
      --blue: #1d66a0;
      --cream: #f6f3ec;
      --gold: #d8a84e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--navy);
      background: var(--cream);
    }

    .contact {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 64px 24px;
    }

    .contact-card {
      width: min(1050px, 100%);
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(11, 31, 51, 0.12);
    }

    .contact-info {
      padding: 56px;
      background: var(--navy);
      color: #fff;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 20px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(36px, 5vw, 54px);
      line-height: 1;
    }

    .intro {
      margin: 0 0 38px;
      color: #c9d5df;
      line-height: 1.7;
    }

    .details {
      display: grid;
      gap: 22px;
    }

    .detail {
      display: grid;
      grid-template-columns: 42px 1fr;
      align-items: center;
      gap: 12px;
    }

    .detail-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      color: var(--gold);
      font-size: 18px;
    }

    .detail strong {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .detail span,
    .detail a {
      color: #e9eef3;
      text-decoration: none;
      line-height: 1.5;
    }

    .contact-form {
      padding: 56px;
    }

    .contact-form h2 {
      margin: 0 0 28px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
    }

    form {
      display: grid;
      gap: 20px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #dce3e8;
      border-radius: 6px;
      padding: 13px 14px;
      font: inherit;
      color: var(--navy);
      background: #fbfcfd;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(29, 102, 160, 0.1);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      justify-self: start;
      border: 0;
      border-radius: 6px;
      padding: 14px 24px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    button:hover {
      background: #15527f;
      transform: translateY(-2px);
    }

    @media (max-width: 800px) {
      .contact { padding: 24px 16px; }
      .contact-card { grid-template-columns: 1fr; }
      .contact-info,
      .contact-form { padding: 36px 28px; }
    }

    @media (max-width: 520px) {
      .field-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <section class="contact" id="contact">
    <div class="contact-card">
      <div class="contact-info">
        <span class="eyebrow">Get in touch</span>
        <h1>Let’s work together.</h1>
        <p class="intro">Have a question or a project in mind? Our team is ready to listen and help you find the right solution.</p>

        <div class="details">
          <div class="detail">
            <div class="detail-icon" aria-hidden="true">@</div>
            <div>
              <strong>Email</strong>
              <a href="mailto:hello@company.com">hello@company.com</a>
            </div>
          </div>

          <div class="detail">
            <div class="detail-icon" aria-hidden="true">☎</div>
            <div>
              <strong>Phone</strong>
              <a href="tel:+12345678900">+1 (234) 567-8900</a>
            </div>
          </div>

          <div class="detail">
            <div class="detail-icon" aria-hidden="true">⌖</div>
            <div>
              <strong>Office</strong>
              <span>123 Business Avenue<br>New York, NY 10001</span>
            </div>
          </div>
        </div>
      </div>

      <div class="contact-form">
        <h2>Send us a message</h2>
        <form>
          <div class="field-row">
            <div>
              <label for="name">Full name</label>
              <input id="name" name="name" type="text" placeholder="John Smith" required>
            </div>
            <div>
              <label for="email">Email address</label>
              <input id="email" name="email" type="email" placeholder="john@example.com" required>
            </div>
          </div>

          <div>
            <label for="subject">Subject</label>
            <input id="subject" name="subject" type="text" placeholder="How can we help?" required>
          </div>

          <div>
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Tell us about your project..." required></textarea>
          </div>

          <button type="submit">Send message</button>
        </form>
      </div>
    </div>
  </section>
</body>
</html>
